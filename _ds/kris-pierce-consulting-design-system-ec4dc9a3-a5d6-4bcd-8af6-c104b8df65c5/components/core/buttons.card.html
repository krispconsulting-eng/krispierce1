<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=700">
  <title>Buttons</title>
  <link rel="stylesheet" href="../../styles.css">
  <style>
    body {
      padding: var(--space-6);
      min-height: 340px;
    }
    .card-title {
      font-family: var(--font-display);
      font-weight: var(--weight-semibold);
      font-size: var(--text-h3);
      color: var(--text-primary);
      margin-bottom: var(--space-5);
    }
    .row {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      margin-bottom: var(--space-5);
    }
    .row-label {
      font-family: var(--font-text);
      font-size: var(--text-xs);
      font-weight: var(--weight-semibold);
      letter-spacing: var(--tracking-overline);
      text-transform: uppercase;
      color: var(--taupe-400);
      width: 110px;
      flex-shrink: 0;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-text);
      font-size: 15px;
      font-weight: var(--weight-semibold);
      padding: 14px 28px;
      border-radius: var(--radius-pill);
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: all var(--dur-base) var(--ease-premium);
      line-height: 1;
    }
    .btn .arrow {
      display: inline-block;
      transition: transform var(--dur-base) var(--ease-premium);
    }

    /* Primary */
    .btn-primary {
      background: var(--btn-primary-bg);
      color: var(--btn-primary-fg);
    }
    .btn-primary:hover {
      background: var(--btn-primary-hover);
      box-shadow: var(--shadow-btn-primary);
    }
    .btn-primary:hover .arrow { transform: translateX(3px); }

    /* Primary hover preview */
    .btn-primary-hover {
      background: var(--btn-primary-hover);
      color: var(--btn-primary-fg);
      box-shadow: var(--shadow-btn-primary);
    }

    /* Outline on light */
    .btn-outline {
      background: transparent;
      color: var(--ink-900);
      border: 1.5px solid var(--border-strong);
    }
    .btn-outline:hover {
      border-color: var(--ink-900);
      box-shadow: var(--shadow-sm);
    }
    .btn-outline:hover .arrow { transform: translateX(3px); }

    /* Outline hover preview */
    .btn-outline-hover {
      background: transparent;
      color: var(--ink-900);
      border: 1.5px solid var(--ink-900);
      box-shadow: var(--shadow-sm);
    }

    /* Dark strip for inverse buttons */
    .dark-strip {
      background: linear-gradient(165deg, var(--forest) 0%, #234A52 100%);
      border-radius: var(--radius-md);
      padding: var(--space-4) var(--space-5);
      display: flex;
      align-items: center;
      gap: var(--space-4);
    }
    .dark-strip .row-label {
      color: var(--taupe-300);
    }

    /* Outline on dark */
    .btn-outline-dark {
      background: transparent;
      color: var(--cream-50);
      border: 1.5px solid rgba(244, 241, 235, 0.5);
    }
    .btn-outline-dark:hover {
      border-color: var(--cream-50);
      background: rgba(255, 255, 255, 0.08);
    }
    .btn-outline-dark:hover .arrow { transform: translateX(3px); }

    /* Outline dark hover preview */
    .btn-outline-dark-hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--cream-50);
      border: 1.5px solid var(--cream-50);
    }

    /* Ghost */
    .btn-ghost {
      background: transparent;
      color: var(--teal-600);
      border: none;
      padding: 14px 16px;
    }
    .btn-ghost:hover {
      color: var(--teal-700);
      background: var(--accent-wash);
    }
    .btn-ghost:hover .arrow { transform: translateX(3px); }

    /* Ghost hover preview */
    .btn-ghost-hover {
      background: var(--accent-wash);
      color: var(--teal-700);
      border: none;
      padding: 14px 16px;
    }

    .state-label {
      font-family: var(--font-text);
      font-size: var(--text-xs);
      color: var(--taupe-400);
      margin-left: var(--space-2);
    }
  </style>
</head>
<body>
  <div class="card-title">Buttons</div>

  <div class="row">
    <span class="row-label">Primary</span>
    <button class="btn btn-primary">Get started <span class="arrow">&rarr;</span></button>
    <button class="btn btn-primary-hover">Hover <span class="arrow" style="transform:translateX(3px)">&rarr;</span></button>
    <span class="state-label">hover</span>
  </div>

  <div class="row">
    <span class="row-label">Outline</span>
    <button class="btn btn-outline">Learn more <span class="arrow">&rarr;</span></button>
    <button class="btn btn-outline-hover">Hover <span class="arrow" style="transform:translateX(3px)">&rarr;</span></button>
    <span class="state-label">hover</span>
  </div>

  <div class="dark-strip" style="margin-bottom: var(--space-5)">
    <span class="row-label">Outline dark</span>
    <button class="btn btn-outline-dark">Contact <span class="arrow">&rarr;</span></button>
    <button class="btn btn-outline-dark-hover">Hover <span class="arrow" style="transform:translateX(3px)">&rarr;</span></button>
    <span class="state-label" style="color: var(--taupe-300)">hover</span>
  </div>

  <div class="row">
    <span class="row-label">Ghost</span>
    <button class="btn btn-ghost">View all <span class="arrow">&rarr;</span></button>
    <button class="btn btn-ghost-hover">Hover <span class="arrow" style="transform:translateX(3px)">&rarr;</span></button>
    <span class="state-label">hover</span>
  </div>
</body>
</html>
