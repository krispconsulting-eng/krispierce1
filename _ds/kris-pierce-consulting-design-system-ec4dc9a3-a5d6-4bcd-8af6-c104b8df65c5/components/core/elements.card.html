<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=700">
  <title>Elements</title>
  <link rel="stylesheet" href="../../styles.css">
  <style>
    body {
      padding: var(--space-6);
      min-height: 350px;
    }
    .card-title {
      font-family: var(--font-display);
      font-weight: var(--weight-semibold);
      font-size: var(--text-h3);
      color: var(--text-primary);
      margin-bottom: var(--space-5);
    }
    .section {
      margin-bottom: var(--space-5);
    }
    .section-label {
      font-family: var(--font-text);
      font-size: 11px;
      font-weight: var(--weight-semibold);
      letter-spacing: var(--tracking-overline);
      text-transform: uppercase;
      color: var(--taupe-400);
      margin-bottom: var(--space-3);
    }
    .row {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      flex-wrap: wrap;
    }

    /* Overlines */
    .overline {
      font-family: var(--font-text);
      font-size: 12px;
      font-weight: var(--weight-semibold);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--teal-600);
    }

    /* Pills */
    .pill {
      display: inline-block;
      font-family: var(--font-text);
      font-size: var(--text-xs);
      font-weight: var(--weight-medium);
      padding: 4px 14px;
      border-radius: var(--radius-pill);
      background: var(--accent-wash);
      color: var(--teal-700);
      line-height: 1.4;
    }
    .pill-blue {
      background: var(--blue-200);
      color: var(--blue-700);
    }
    .pill-taupe {
      background: var(--taupe-100);
      color: var(--taupe-600);
    }

    /* Icon chips */
    .icon-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--accent-wash);
      color: var(--teal-600);
    }
    .icon-chip-blue {
      background: var(--blue-200);
      color: var(--blue-600);
    }
    .icon-chip svg {
      width: 20px;
      height: 20px;
    }

    /* Avatars */
    .avatar {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-family: var(--font-text);
      font-size: 14px;
      font-weight: var(--weight-semibold);
      color: var(--cream-50);
    }
    .avatar-forest { background: var(--forest); }
    .avatar-teal { background: var(--teal-600); }
    .avatar-blue { background: var(--blue-600); }
    .avatar-taupe { background: var(--taupe-500); }

    .avatar-stack {
      display: flex;
    }
    .avatar-stack .avatar {
      border: 2.5px solid var(--cream-50);
      margin-left: -12px;
    }
    .avatar-stack .avatar:first-child {
      margin-left: 0;
    }

    /* Badges */
    .badge {
      display: inline-block;
      font-family: var(--font-text);
      font-size: 12px;
      font-weight: var(--weight-semibold);
      padding: 3px 10px;
      border-radius: var(--radius-xs);
      line-height: 1.4;
    }
    .badge-sage {
      background: rgba(94, 122, 85, 0.12);
      color: var(--sage-500);
    }
    .badge-amber {
      background: rgba(181, 135, 47, 0.12);
      color: var(--amber-500);
    }
    .badge-brick {
      background: rgba(158, 75, 59, 0.12);
      color: var(--brick-500);
    }
    .badge-slate {
      background: rgba(78, 99, 115, 0.12);
      color: var(--slate-500);
    }
  </style>
</head>
<body>
  <div class="card-title">Elements</div>

  <!-- Overlines -->
  <div class="section">
    <div class="section-label">Overline / Eyebrow</div>
    <div class="row">
      <span class="overline">Strategy</span>
      <span class="overline">Advisory</span>
      <span class="overline">Capability</span>
    </div>
  </div>

  <!-- Pills -->
  <div class="section">
    <div class="section-label">Pills</div>
    <div class="row">
      <span class="pill">Organisational Design</span>
      <span class="pill-blue pill">Programme Delivery</span>
      <span class="pill-taupe pill">Governance</span>
    </div>
  </div>

  <!-- Icon chips -->
  <div class="section">
    <div class="section-label">Icon Chips</div>
    <div class="row">
      <span class="icon-chip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      </span>
      <span class="icon-chip-blue icon-chip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
      </span>
      <span class="icon-chip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
      </span>
    </div>
  </div>

  <!-- Avatars and stack -->
  <div class="section">
    <div class="section-label">Avatars and Stack</div>
    <div class="row">
      <span class="avatar avatar-forest">KP</span>
      <span class="avatar avatar-teal">JM</span>
      <span class="avatar avatar-blue">AL</span>
      <span class="avatar avatar-taupe">SR</span>
      <span style="width: var(--space-4)"></span>
      <div class="avatar-stack">
        <span class="avatar avatar-forest">KP</span>
        <span class="avatar avatar-teal">JM</span>
        <span class="avatar avatar-blue">AL</span>
        <span class="avatar avatar-taupe">SR</span>
      </div>
    </div>
  </div>

  <!-- Badges -->
  <div class="section">
    <div class="section-label">Status Badges</div>
    <div class="row">
      <span class="badge badge-sage">Active</span>
      <span class="badge badge-amber">In Review</span>
      <span class="badge badge-brick">Overdue</span>
      <span class="badge badge-slate">Archived</span>
    </div>
  </div>
</body>
</html>
