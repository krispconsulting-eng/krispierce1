<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=700">
  <title>Spacing Scale</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 700px;
      min-height: 350px;
      background: var(--cream-50);
      font-family: 'Archivo', sans-serif;
      color: var(--ink-900);
      padding: 28px 32px;
    }
    h2 {
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      font-size: 18px;
      letter-spacing: 0.01em;
      margin-bottom: 20px;
      color: var(--ink-900);
    }
    .scale-row {
      display: flex;
      align-items: center;
      margin-bottom: 6px;
    }
    .scale-label {
      width: 100px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-900);
      flex-shrink: 0;
    }
    .scale-value {
      width: 48px;
      font-size: 11px;
      font-weight: 400;
      color: var(--taupe-400);
      flex-shrink: 0;
      text-align: right;
      padding-right: 12px;
    }
    .scale-bar {
      height: 14px;
      border-radius: var(--radius-xs);
      background: var(--teal-600);
      transition: width 300ms var(--ease-out);
    }
  </style>
</head>
<body>
  <h2>Spacing Scale (4px base)</h2>

  <div class="scale-row">
    <span class="scale-label">space-1</span>
    <span class="scale-value">4px</span>
    <div class="scale-bar" style="width: 4px;"></div>
  </div>
  <div class="scale-row">
    <span class="scale-label">space-2</span>
    <span class="scale-value">8px</span>
    <div class="scale-bar" style="width: 8px;"></div>
  </div>
  <div class="scale-row">
    <span class="scale-label">space-3</span>
    <span class="scale-value">12px</span>
    <div class="scale-bar" style="width: 12px;"></div>
  </div>
  <div class="scale-row">
    <span class="scale-label">space-4</span>
    <span class="scale-value">16px</span>
    <div class="scale-bar" style="width: 16px;"></div>
  </div>
  <div class="scale-row">
    <span class="scale-label">space-5</span>
    <span class="scale-value">24px</span>
    <div class="scale-bar" style="width: 24px;"></div>
  </div>
  <div class="scale-row">
    <span class="scale-label">space-6</span>
    <span class="scale-value">32px</span>
    <div class="scale-bar" style="width: 32px;"></div>
  </div>
  <div class="scale-row">
    <span class="scale-label">space-7</span>
    <span class="scale-value">48px</span>
    <div class="scale-bar" style="width: 48px;"></div>
  </div>
  <div class="scale-row">
    <span class="scale-label">space-8</span>
    <span class="scale-value">64px</span>
    <div class="scale-bar" style="width: 64px;"></div>
  </div>
  <div class="scale-row">
    <span class="scale-label">space-9</span>
    <span class="scale-value">96px</span>
    <div class="scale-bar" style="width: 96px;"></div>
  </div>
  <div class="scale-row">
    <span class="scale-label">space-10</span>
    <span class="scale-value">128px</span>
    <div class="scale-bar" style="width: 128px;"></div>
  </div>
  <div class="scale-row">
    <span class="scale-label">space-11</span>
    <span class="scale-value">176px</span>
    <div class="scale-bar" style="width: 176px;"></div>
  </div>
</body>
</html>
