<!-- @dsCard group="Type" -->
<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=700">
  <title>Type: Hero Headline</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 700px;
      height: 280px;
      overflow: hidden;
      background: linear-gradient(165deg, var(--forest) 0%, #234A52 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 40px 48px;
    }
    .label {
      font-family: var(--font-text);
      font-size: var(--text-overline);
      font-weight: var(--weight-semibold);
      letter-spacing: var(--tracking-overline);
      text-transform: uppercase;
      color: var(--blue-200);
      margin-bottom: 20px;
    }
    .hero-headline {
      font-family: var(--font-display);
      font-weight: var(--weight-light);
      font-size: 56px;
      line-height: var(--leading-tight);
      letter-spacing: var(--tracking-tight);
      color: var(--text-on-inverse);
    }
    .hero-headline .highlight {
      color: var(--blue-200);
      font-weight: var(--weight-light);
    }
    .spec {
      font-family: var(--font-text);
      font-size: var(--text-xs);
      color: var(--text-on-inverse-muted);
      margin-top: 24px;
      line-height: var(--leading-normal);
    }
  </style>
</head>
<body>
  <div class="label">Hero Headline</div>
  <div class="hero-headline">
    Strategy that builds<br><span class="highlight">lasting</span> capability
  </div>
  <div class="spec">Outfit 200 / 56 px fluid / line-height 0.96 / tracking -0.035em / highlight word in Blue 200</div>
</body>
</html>
