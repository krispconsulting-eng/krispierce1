<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=700">
  <title>Accent Wash</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 700px;
      min-height: 180px;
      background: var(--cream-50);
      font-family: 'Archivo', sans-serif;
      color: var(--ink-900);
      padding: 28px 32px;
    }
    h2 {
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      font-size: 18px;
      letter-spacing: 0.01em;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 12px;
      color: var(--taupe-400);
      margin-bottom: 22px;
    }
    .demo-area {
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }
    .wash-block {
      background: var(--accent-wash);
      border-radius: 16px;
      padding: 20px 24px;
      flex: 1;
    }
    .wash-block .label {
      font-family: 'Archivo', sans-serif;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--teal-600);
      margin-bottom: 12px;
    }
    .tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: rgba(61,122,107,0.10);
      color: var(--teal-700);
      letter-spacing: 0.01em;
    }
    .chips {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .icon-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px 6px 8px;
      border-radius: 10px;
      background: var(--accent-wash);
      border: 1px solid rgba(61,122,107,0.14);
      font-size: 12px;
      font-weight: 500;
      color: var(--teal-700);
    }
    .icon-chip .icon-dot {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: rgba(61,122,107,0.16);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: var(--teal-600);
    }
    .spec-panel {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 180px;
    }
    .spec-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
    }
    .spec-row .key {
      font-weight: 600;
      color: var(--ink-900);
    }
    .spec-row .val {
      color: var(--taupe-400);
      font-family: 'Archivo', monospace;
    }
    .wash-swatch {
      width: 100%;
      height: 32px;
      border-radius: 8px;
      background: var(--accent-wash);
      border: 1px solid var(--border-subtle);
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <h2>Accent Wash</h2>
  <p class="subtitle">A soft teal tint for tags, icon chips, and highlighted areas.</p>

  <div class="demo-area">
    <!-- Left: examples on wash bg -->
    <div class="wash-block">
      <div class="label">Tags on wash</div>
      <div class="tags" style="margin-bottom: 14px;">
        <span class="tag">Strategy</span>
        <span class="tag">Governance</span>
        <span class="tag">Risk</span>
        <span class="tag">Advisory</span>
      </div>
      <div class="label" style="margin-top: 4px;">Icon chips</div>
      <div class="chips">
        <span class="icon-chip">
          <span class="icon-dot">S</span>
          Scoping
        </span>
        <span class="icon-chip">
          <span class="icon-dot">D</span>
          Discovery
        </span>
        <span class="icon-chip">
          <span class="icon-dot">R</span>
          Review
        </span>
      </div>
    </div>

    <!-- Right: spec -->
    <div class="spec-panel">
      <div class="wash-swatch"></div>
      <div class="spec-row">
        <span class="key">Token</span>
        <span class="val">--accent-wash</span>
      </div>
      <div class="spec-row">
        <span class="key">Hex</span>
        <span class="val">#E7F0EC</span>
      </div>
      <div class="spec-row">
        <span class="key">Use</span>
        <span class="val">bg tint, tags</span>
      </div>
    </div>
  </div>
</body>
</html>
