<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=700">
  <title>Brand: Gradient System</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 700px;
      min-height: 200px;
      background: var(--cream-50);
      font-family: 'Archivo', sans-serif;
      color: var(--ink-900);
      padding: 28px 32px;
    }
    h2 {
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      font-size: 18px;
      letter-spacing: 0.01em;
      margin-bottom: 20px;
      color: var(--ink-900);
    }
    .gradient-stack {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .gradient-strip {
      border-radius: var(--radius-md);
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }
    .gradient-strip--hero {
      background: linear-gradient(165deg, #1E3D34 0%, #234A52 100%);
    }
    .gradient-strip--cta {
      background: linear-gradient(165deg, #1E3D34 0%, #1B4A4A 50%, #234A52 100%);
    }
    .gradient-name {
      font-family: 'Archivo', sans-serif;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--cream-50);
    }
    .gradient-spec {
      font-family: 'Archivo', sans-serif;
      font-size: 11px;
      color: var(--teal-400);
      text-align: right;
      line-height: 1.4;
    }
    .gradient-meta {
      display: flex;
      gap: 24px;
      margin-top: 6px;
    }
    .gradient-meta span {
      font-size: 11px;
      color: var(--taupe-400);
    }
  </style>
</head>
<body>
  <h2>Gradients: Hero and CTA</h2>
  <div class="gradient-stack">
    <div class="gradient-strip gradient-strip--hero">
      <span class="gradient-name">Hero Gradient</span>
      <span class="gradient-spec">165deg: #1E3D34 → #234A52</span>
    </div>
    <div class="gradient-strip gradient-strip--cta">
      <span class="gradient-name">CTA Gradient</span>
      <span class="gradient-spec">165deg: #1E3D34 → #1B4A4A → #234A52</span>
    </div>
  </div>
  <div class="gradient-meta">
    <span>Direction: 165deg (top-left to bottom-right)</span>
    <span>Used on: hero sections, CTA banners, dark surfaces</span>
  </div>
</body>
</html>
